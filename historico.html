<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Histórico | Connection 70x7</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        :root {
            --bg-primary: #050505;
            --bg-secondary: #0A0A0A;
            --text-primary: #FFFFFF;
            --text-secondary: #A3A3A3;
            --accent-red: #ef4444;
            --border-light: rgba(255, 255, 255, 0.08);
            --glass-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
            --transition-smooth: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding-top: 80px;
            padding-bottom: 80px;
        }

        .header {
            background-color: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(20px);
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            border-bottom: 1px solid var(--border-light);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -1px;
            text-decoration: none;
            color: var(--text-primary);
        }

        .nav-menu {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-menu a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-menu a:hover {
            color: var(--accent-red);
        }

        .nav-menu a.active {
            color: var(--accent-red);
        }
        
        .nav-menu a .material-icons {
            font-size: 16px;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #a3a3a3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .page-header p {
            font-size: 0.75rem;
            color: var(--accent-red);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            margin-top: 8px;
        }

        .historico-lista {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .historico-card {
            background: var(--glass-bg);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 18px;
            transition: var(--transition-smooth);
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }
        .historico-card:hover {
            border-color: var(--accent-red);
            transform: translateX(5px);
        }
        .historico-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .participante-nome {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent-red);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .participante-nome .material-icons {
            font-size: 18px;
        }
        .pontos-valor {
            font-weight: 800;
            font-size: 1.3rem;
            background: rgba(239,68,68,0.15);
            padding: 4px 12px;
            border-radius: 30px;
        }
        .criterio-info {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .criterio-info .material-icons {
            font-size: 14px;
        }
        .observacao-info {
            font-size: 0.85rem;
            color: var(--text-primary);
            background: rgba(255,255,255,0.03);
            padding: 8px 12px;
            border-radius: 12px;
            margin-top: 8px;
            border-left: 2px solid var(--accent-red);
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }
        .observacao-info .material-icons {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .data-info {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 10px;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }
        .data-info .material-icons {
            font-size: 12px;
        }
        .empty-history {
            text-align: center;
            color: var(--text-secondary);
            padding: 50px 20px;
            font-style: italic;
            background: var(--glass-bg);
            border-radius: 24px;
            border: 1px solid var(--border-light);
        }
        .back-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--accent-red);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(239,68,68,0.3);
            transition: var(--transition-smooth);
            z-index: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .back-btn .material-icons {
            font-size: 24px;
        }
        .back-btn:hover { transform: scale(1.1); }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 600px) {
            .historico-header { flex-direction: column; align-items: flex-start; gap: 8px; }
            .nav-menu { gap: 15px; }
            .nav-menu a { font-size: 10px; letter-spacing: 1px; }
            .logo { font-size: 1rem; }
        }
    </style>
</head>
<body>
<header class="header">
    <a href="index.html" class="logo">CONNECTION 70x7</a>
    <div class="nav-menu">
        <a href="index.html"><span class="material-icons">emoji_events</span> RANKING</a>
        <a href="historico.html" class="active"><span class="material-icons">history</span> HISTÓRICO</a>
    </div>
</header>

<div class="container">
    <div class="page-header">
        <h1><span class="material-icons">history</span> Histórico de Pontuações</h1>
        <p>Todas as movimentações registradas</p>
    </div>
    <div id="historico-container" class="historico-lista">
        <div class="empty-history">Carregando histórico...</div>
    </div>
</div>

<a href="index.html" class="back-btn" title="Voltar"><span class="material-icons">arrow_back</span></a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAeHHx4PPbBayDIicW-ZVRqnf9OqAlUbBw",
    authDomain: "ranking-jovens-d17d6.firebaseapp.com",
    projectId: "ranking-jovens-d17d6",
    storageBucket: "ranking-jovens-d17d6.firebasestorage.app",
    messagingSenderId: "523093300634",
    appId: "1:523093300634:web:9fbfad3cb992e109a9d623"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const participantes = [
    {id: 1, nome: 'Ester'}, {id: 2, nome: 'Isabelle'}, {id: 3, nome: 'Flávia'},
    {id: 4, nome: 'Júlia'}, {id: 5, nome: 'Geovana'}, {id: 6, nome: 'João'},
    {id: 7, nome: 'Pedro'}, {id: 8, nome: 'Moisés'}, {id: 9, nome: 'Miguel'},
    {id: 10, nome: 'Mariana'}, {id: 11, nome: 'Mateus'}, {id: 12, nome: 'Davi'},
    {id: 13, nome: 'Guilherme'}
];

const container = document.getElementById('historico-container');

function formatarData(dataISO) {
    if (!dataISO) return 'Data não registrada';
    const data = new Date(dataISO);
    return data.toLocaleString('pt-BR', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
    });
}

function getNomeParticipante(id) {
    if (id === 0) return 'SISTEMA';
    const p = participantes.find(p => p.id === id);
    return p ? p.nome : 'Desconhecido';
}

function renderHistorico(transacoes) {
    if (!transacoes || transacoes.length === 0) {
        container.innerHTML = '<div class="empty-history">Nenhuma movimentação registrada</div>';
        return;
    }
    
    const filtered = transacoes.filter(t => t.criterio !== 'reset_global');
    if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-history">Nenhuma movimentação registrada</div>';
        return;
    }
    
    container.innerHTML = filtered.map((t, index) => {
        const nome = getNomeParticipante(t.participante_id);
        const valor = t.valor || 0;
        const criterioTexto = t.nome_criterio ? `Critério: ${t.nome_criterio}` : '';
        const observacaoTexto = t.observacao ? t.observacao : '';
        const dataFormatada = formatarData(t.data);
        
        return `
            <div class="historico-card" style="animation-delay: ${0.05 * index}s">
                <div class="historico-header">
                    <span class="participante-nome"><span class="material-icons">person</span> ${nome}</span>
                    <span class="pontos-valor">+${valor} pts</span>
                </div>
                ${criterioTexto ? `<div class="criterio-info"><span class="material-icons">sell</span> ${criterioTexto}</div>` : ''}
                ${observacaoTexto ? `<div class="observacao-info"><span class="material-icons">comment</span> ${observacaoTexto}</div>` : ''}
                <div class="data-info"><span class="material-icons">schedule</span> ${dataFormatada}</div>
            </div>
        `;
    }).join('');
}

const q = query(collection(db, "transacoes"), orderBy("data", "desc"));
onSnapshot(q, (snapshot) => {
    const transacoes = snapshot.docs.map(doc => doc.data());
    renderHistorico(transacoes);
}, (error) => {
    console.error(error);
    container.innerHTML = '<div class="empty-history">Erro ao carregar histórico. Verifique sua conexão.</div>';
});
</script>
</body>
</html>
